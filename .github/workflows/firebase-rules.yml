name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/firebase-rules.yml, scripts/firebase-release.mjs]

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run test:rules
      - name: Deploy Firestore rules
        env:
          HOSTING_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_GRADUATION_TRIP_2027 }}
          RULES_CREDENTIAL: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          umask 077
          credentials="$(mktemp "$RUNNER_TEMP/firebase-rules-credentials.XXXXXX.json")"
          trap 'rm -f -- "$credentials"' EXIT
          node scripts/firebase-release.mjs select "$credentials"
          if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
            echo "::error::Main changed after checkout. Run the workflow on current main."
            exit 1
          fi
          unset HOSTING_CREDENTIAL RULES_CREDENTIAL
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" ./node_modules/.bin/firebase deploy \
            --only firestore:rules --project japan-graduation-trip-2027 --non-interactive
          node scripts/firebase-release.mjs verify "$credentials"
