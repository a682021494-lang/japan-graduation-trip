name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Firestore rules]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check current main before running browser suites
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
            echo "::error::Main changed after checkout. Run the workflow on current main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run test:cloud && node scripts/render-check.mjs
      - name: Test Firestore rules, Chrome and synchronized travel editing
        env:
          TRIP_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npx firebase emulators:exec --only auth,firestore,hosting --project demo-trip-2027 \
            'node --test scripts/firestore.test.mjs && npm run test:browser && node --test scripts/guest-browser.test.mjs scripts/mobile-pwa.test.mjs && node scripts/image-smoke.mjs'
      - name: Test WebKit
        run: |
          npx playwright install --with-deps webkit
          npx firebase emulators:exec --only hosting --project demo-trip-2027 \
            'TRIP_QA_ENGINE=webkit node --test scripts/guest-browser.test.mjs scripts/mobile-pwa.test.mjs'
      - name: Verify published rules before enabling extended groups
        id: rules
        env:
          HOSTING_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_GRADUATION_TRIP_2027 }}
          RULES_CREDENTIAL: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
            echo "::error::Main changed after checkout. Run the workflow on current main."
            exit 1
          fi
          node scripts/firebase-release.mjs check
      - name: Test the legacy group fallback against the previous production rules
        env:
          TRIP_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          git show 424c180:firestore.rules > "$RUNNER_TEMP/production-firestore.rules"
          cp firestore.rules "$RUNNER_TEMP/candidate-firestore.rules"
          trap 'cp "$RUNNER_TEMP/candidate-firestore.rules" firestore.rules' EXIT
          cp "$RUNNER_TEMP/production-firestore.rules" firestore.rules
          TRIP_QA_LEGACY=1 npx firebase emulators:exec --only auth,firestore,hosting --project demo-trip-2027 "npm run test:browser"
      - name: Configure published group capabilities
        if: steps.rules.outputs.extended == 'true'
        run: sed -i 's/:false;/:true;/' dist/cloud-config.js
      - name: Build public cache for the final deployment configuration
        run: node scripts/build-pwa.mjs
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_GRADUATION_TRIP_2027 }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::The Firebase deployment secret is missing."
            exit 1
          fi
          umask 077
          credentials="$(mktemp "$RUNNER_TEMP/firebase-credentials.XXXXXX.json")"
          trap 'rm -f -- "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          unset FIREBASE_SERVICE_ACCOUNT
          if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
            echo "::error::Main changed after checkout. Run the workflow on current main."
            exit 1
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" ./node_modules/.bin/firebase deploy \
            --only hosting --project japan-graduation-trip-2027 --non-interactive
      - name: Verify public entry point and travel data
        shell: bash
        run: |
          origin='https://japan-graduation-trip-2027.web.app'
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --max-time 15 -D "$RUNNER_TEMP/hosting-headers" "$origin/" -o "$RUNNER_TEMP/hosting-index" &&
               cmp -s dist/index.html "$RUNNER_TEMP/hosting-index" &&
               curl --fail --silent --show-error --max-time 15 "$origin/app.js?v=20261125-images" -o "$RUNNER_TEMP/hosting-app" &&
               cmp -s dist/app.js "$RUNNER_TEMP/hosting-app" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/trip-images.js" -o "$RUNNER_TEMP/hosting-images" &&
               cmp -s dist/data/trip-images.js "$RUNNER_TEMP/hosting-images" &&
               curl --fail --silent --show-error --max-time 15 "$origin/geography.js" -o "$RUNNER_TEMP/hosting-geography" &&
               cmp -s dist/geography.js "$RUNNER_TEMP/hosting-geography" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/areas/tourism.json" -o "$RUNNER_TEMP/hosting-tourism" &&
               cmp -s dist/data/areas/tourism.json "$RUNNER_TEMP/hosting-tourism" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/areas/places.json" -o "$RUNNER_TEMP/hosting-places" &&
               cmp -s dist/data/areas/places.json "$RUNNER_TEMP/hosting-places" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/winter.js" -o "$RUNNER_TEMP/hosting-winter" &&
               cmp -s dist/data/winter.js "$RUNNER_TEMP/hosting-winter" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/trips.json" -o "$RUNNER_TEMP/hosting-trips" &&
               cmp -s dist/data/trips.json "$RUNNER_TEMP/hosting-trips" &&
               curl --fail --silent --show-error --max-time 15 "$origin/style.css" -o "$RUNNER_TEMP/hosting-style" &&
               cmp -s dist/style.css "$RUNNER_TEMP/hosting-style" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/areas/prefectures.json" -o "$RUNNER_TEMP/hosting-prefectures" &&
               cmp -s dist/data/areas/prefectures.json "$RUNNER_TEMP/hosting-prefectures" &&
               curl --fail --silent --show-error --max-time 15 "$origin/logic.js" -o "$RUNNER_TEMP/hosting-logic" &&
               cmp -s dist/logic.js "$RUNNER_TEMP/hosting-logic" &&
               curl --fail --silent --show-error --max-time 15 "$origin/cloud-ui.js" -o "$RUNNER_TEMP/hosting-cloud-ui" &&
               cmp -s dist/cloud-ui.js "$RUNNER_TEMP/hosting-cloud-ui" &&
               curl --fail --silent --show-error --max-time 15 "$origin/cloud-config.js" -o "$RUNNER_TEMP/hosting-cloud-config" &&
               cmp -s dist/cloud-config.js "$RUNNER_TEMP/hosting-cloud-config" &&
               curl --fail --silent --show-error --max-time 15 "$origin/sw.js" -o "$RUNNER_TEMP/hosting-service-worker" &&
               cmp -s dist/sw.js "$RUNNER_TEMP/hosting-service-worker" &&
               curl --fail --silent --show-error --max-time 15 "$origin/manifest.webmanifest" -o "$RUNNER_TEMP/hosting-manifest" &&
               cmp -s dist/manifest.webmanifest "$RUNNER_TEMP/hosting-manifest" &&
               grep -iq '^cache-control:.*no-cache' "$RUNNER_TEMP/hosting-headers"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The public website did not serve the deployed entry point and cache policy."
          exit 1
