name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_GRADUATION_TRIP_2027 }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::The Firebase deployment secret is missing."
            exit 1
          fi
          umask 077
          credentials="$(mktemp "$RUNNER_TEMP/firebase-credentials.XXXXXX.json")"
          trap 'rm -f -- "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          unset FIREBASE_SERVICE_ACCOUNT
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" ./node_modules/.bin/firebase deploy \
            --only hosting --project japan-graduation-trip-2027 --non-interactive
      - name: Verify public entry point and travel data
        shell: bash
        run: |
          origin='https://japan-graduation-trip-2027.web.app'
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --max-time 15 -D "$RUNNER_TEMP/hosting-headers" "$origin/" -o "$RUNNER_TEMP/hosting-index" &&
               cmp -s dist/index.html "$RUNNER_TEMP/hosting-index" &&
               curl --fail --silent --show-error --max-time 15 "$origin/app.js?v=20261125-images" -o "$RUNNER_TEMP/hosting-app" &&
               cmp -s dist/app.js "$RUNNER_TEMP/hosting-app" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/trip-images.js" -o "$RUNNER_TEMP/hosting-images" &&
               cmp -s dist/data/trip-images.js "$RUNNER_TEMP/hosting-images" &&
               curl --fail --silent --show-error --max-time 15 "$origin/geography.js" -o "$RUNNER_TEMP/hosting-geography" &&
               cmp -s dist/geography.js "$RUNNER_TEMP/hosting-geography" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/areas/tourism.json" -o "$RUNNER_TEMP/hosting-tourism" &&
               cmp -s dist/data/areas/tourism.json "$RUNNER_TEMP/hosting-tourism" &&
               curl --fail --silent --show-error --max-time 15 "$origin/data/areas/places.json" -o "$RUNNER_TEMP/hosting-places" &&
               cmp -s dist/data/areas/places.json "$RUNNER_TEMP/hosting-places" &&
               grep -iq '^cache-control:.*no-cache' "$RUNNER_TEMP/hosting-headers"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The public website did not serve the deployed entry point and cache policy."
          exit 1
