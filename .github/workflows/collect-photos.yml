name: Review candidate photos for remaining landmarks
on:
  push:
    branches: [attraction-photo-research]
permissions:
  contents: read
jobs:
  collect:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python public-license-candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: attraction-followup-photos
          path: collected
          retention-days: 1
